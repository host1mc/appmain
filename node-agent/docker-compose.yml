services:
  node-agent:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # Publish on NODE_PUBLISH_ADDRESS (README documents this); defaults to
      # 0.0.0.0 when unset so the panel can reach it at the host's address.
      - "${NODE_PUBLISH_ADDRESS:-0.0.0.0}:${NODE_PORT:-8081}:${NODE_PORT:-8081}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind the data root at the SAME path inside the container as on the host.
      # The child bot containers are created against the host daemon and
      # bind-mount <NODE_DATA_ROOT>/<id>, so the agent must see that host path at
      # an identical path — otherwise uploaded files never reach the containers.
      - "${NODE_DATA_ROOT:-/home/ubuntu/dchost}:${NODE_DATA_ROOT:-/home/ubuntu/dchost}"





