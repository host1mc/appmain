services:
  node-agent:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # Publish on NODE_PUBLISH_ADDRESS (README documents this); defaults to
      # loopback when unset. This port is full Docker-daemon control behind one
      # bearer token and performs no per-server ownership check, so it must
      # never fail open to 0.0.0.0 — widen it explicitly to the panel's private
      # address when the panel runs on another host.
      - "${NODE_PUBLISH_ADDRESS:-127.0.0.1}:${NODE_PORT:-8081}:${NODE_PORT:-8081}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind the data root at the SAME path inside the container as on the host.
      # The child bot containers are created against the host daemon and
      # bind-mount <NODE_DATA_ROOT>/<id>, so the agent must see that host path at
      # an identical path — otherwise uploaded files never reach the containers.
      - "${NODE_DATA_ROOT:-/home/ubuntu/dchost}:${NODE_DATA_ROOT:-/home/ubuntu/dchost}"





